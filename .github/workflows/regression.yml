name: regression

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.23 integration patch
        if: github.ref == 'refs/heads/v023-market-mods'
        run: node scripts/v023-patch.js
      - name: Syntax check
        run: |
          node --check data.js
          node --check mods.js
          node --check engine.js
          node --check game.js
          node --check help.js
          node --check gesture.js
          node --check ui.js
      - name: Regression suite
        run: |
          status=0
          for test in tests/*.test.js; do
            echo "==> $test"
            node "$test" || status=1
          done
          exit $status
      - name: Commit validated generated patch
        if: github.ref == 'refs/heads/v023-market-mods'
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js ui.js
          git commit -m "Integrate v0.23 Market UI and target rules"
          git push
