name: regression

on:
  push:
    branches: [main, v023-clean-rebuild, v024-endless]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply pending v0.24 Endless patch
        run: |
          if [ -f scripts/apply-v024-endless.js ]; then
            echo "APPLIED_V024=1" >> "$GITHUB_ENV"
            node scripts/apply-v024-endless.js
            node - <<'NODE'
          const fs=require('fs');
          const path='tests/v024-endless.test.js';
          let s=fs.readFileSync(path,'utf8');
          s=s.replace("assert.match(game.debugText(),/Round: 18/∞/);","assert(game.debugText().includes('Round: 18/∞'));");
          fs.writeFileSync(path,s);
          NODE
          fi
      - name: Syntax check
        run: |
          node --check data.js
          node --check mods.js
          node --check engine.js
          node --check game.js
          node --check help.js
          node --check gesture.js
          node --check ui.js
          node --check tests/browser-smoke.spec.js
          if [ -f tests/v024-endless.test.js ]; then node --check tests/v024-endless.test.js; fi
          if [ -f tests/v024-endless-ui.test.js ]; then node --check tests/v024-endless-ui.test.js; fi
      - name: Regression suite
        run: |
          set -e
          for test in tests/*.test.js; do
            echo "==> $test"
            node "$test"
          done
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          set -e
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/iterion-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/iterion-http.log
            exit 1
          fi
          npm run test:browser
      - name: Persist green v0.24 Endless patch
        if: env.APPLIED_V024 == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js game.js help.js ui.js tests
          git add -u scripts
          git commit -m "Add Endless mode after base run completion"
          git push origin HEAD:v024-endless
