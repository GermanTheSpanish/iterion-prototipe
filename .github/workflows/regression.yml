name: regression

on:
  push:
    branches: [main, v023-clean-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply pending Stage E patch
        run: |
          if [ -f scripts/apply-stage-e.js ]; then
            echo "APPLIED_STAGE_PATCH=1" >> "$GITHUB_ENV"
            node - <<'NODE'
          const fs=require('fs');
          const path='tests/v019-ui.test.js';
          let s=fs.readFileSync(path,'utf8');
          s=s.replace("assert.match(ui,/DOUBLE DOUBLE/,'Market UI must expose Double Double by name');","assert.match(ui,/escapeHtml\\(mod\\.displayName\\|\\|mod\\.name\\)/,'Market UI must render offered modifier names from the registry');");
          s=s.replace("assert.match(ui,/doubleDoubleMark/,'Double Double tiles must have a visual marker');","assert.match(ui,/tileModMarks/,'Physical tile modifiers must have a visual marker renderer');");
          s=s.replace("assert.match(html,/\\.doubleDoubleMark\\{/);","assert.match(html,/\\.tileModMark\\{/);");
          fs.writeFileSync(path,s);
          NODE
            node scripts/apply-stage-e.js
          fi
      - name: Syntax check
        run: |
          node --check data.js
          node --check mods.js
          node --check engine.js
          node --check game.js
          node --check help.js
          node --check gesture.js
          node --check ui.js
      - name: Regression suite
        run: |
          set -e
          for test in tests/*.test.js; do
            echo "==> $test"
            node "$test"
          done
      - name: Persist green Stage E patch
        if: env.APPLIED_STAGE_PATCH == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js mods.js engine.js game.js help.js gesture.js ui.js index.html tests
          git add -u scripts
          git commit -m "Stage E: Market UI Rulebook Inspector telemetry"
          git push origin HEAD:v023-clean-rebuild
