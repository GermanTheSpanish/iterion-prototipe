name: regression

on:
  push:
    branches: [main, v023-clean-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply pending Stage B patch
        run: |
          if [ -f scripts/apply-stage-b.js ]; then
            echo "APPLIED_STAGE_PATCH=1" >> "$GITHUB_ENV"
            node scripts/apply-stage-b.js
          fi
      - name: Syntax check
        run: |
          node --check data.js
          node --check mods.js
          node --check engine.js
          node --check game.js
          node --check help.js
          node --check gesture.js
          node --check ui.js
      - name: Regression suite
        run: |
          set -e
          for test in tests/*.test.js; do
            echo "==> $test"
            node "$test"
          done
      - name: Persist green Stage B patch
        if: env.APPLIED_STAGE_PATCH == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage B: Long Run machine mod and star economy"
          git push origin HEAD:v023-clean-rebuild
