name: regression

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for file in *.js tests/*.js; do node --check "$file"; done
      - name: Regression suite
        run: |
          set -e
          for test in tests/*.test.js; do
            echo "==> $test"
            node "$test"
          done
      - name: Install browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          set -e
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/iterion-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/iterion-http.log
            exit 1
          fi
          npm run test:browser
      - name: Verify committed tree is unchanged
        if: always()
        run: |
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"
