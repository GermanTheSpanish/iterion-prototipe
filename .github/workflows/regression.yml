name: regression

on:
  push:
    branches: [main, v023-clean-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply gated v0.23.0 release bump
        run: |
          if [ -f scripts/release-v023.js ]; then
            echo "RELEASE_BUMP=1" >> "$GITHUB_ENV"
            node scripts/release-v023.js
          fi
      - name: Syntax check
        run: |
          node --check data.js
          node --check mods.js
          node --check engine.js
          node --check game.js
          node --check help.js
          node --check gesture.js
          node --check ui.js
          node --check tests/browser-smoke.spec.js
      - name: Regression suite
        run: |
          set -e
          for test in tests/*.test.js; do
            echo "==> $test"
            node "$test"
          done
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          set -e
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/iterion-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/iterion-http.log
            exit 1
          fi
          npm run test:browser
      - name: Persist green v0.23.0 release bump
        if: env.RELEASE_BUMP == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js tests
          git add -u scripts
          git commit -m "Release ITERION v0.23.0"
          git push origin HEAD:v023-clean-rebuild
