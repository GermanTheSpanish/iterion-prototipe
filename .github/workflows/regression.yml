name: regression

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check data.js
          node --check mods.js
          node --check engine.js
          node --check game.js
          node --check help.js
          node --check gesture.js
          node --check ui.js
      - name: Regression suite
        run: |
          status=0
          for test in tests/*.test.js; do
            echo "==> $test"
            node "$test" || status=1
          done
          exit $status
