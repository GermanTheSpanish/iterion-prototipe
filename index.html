<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ITERION v0.7.0</title>
<style>
:root{--bg:#eee9df;--panel:#f8f5ee;--ink:#171717;--muted:#77736b;--blue:#417bc1;--green:#3c8b62;--orange:#d47b28;--red:#a64c42}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 10px calc(20px + env(safe-area-inset-bottom))}header{padding:12px 2px 7px;display:flex;justify-content:space-between;align-items:end}h1{margin:0;font-size:24px;letter-spacing:.16em}.sub,.k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat,.panel,.boardWrap{background:rgba(255,255,255,.48);border:1px solid rgba(0,0,0,.1);border-radius:14px}.stat{padding:8px 9px}.v{font-size:20px;font-weight:700;margin-top:2px}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px 0}button{font:inherit}.toolbar button,.action button,.copyBtn,button.tile,.debugBtn{border:1px solid rgba(0,0,0,.18);background:var(--panel);border-radius:10px;color:var(--ink);font-weight:650}.toolbar button{padding:9px 2px;font-size:12px}.toolbar button.on{background:var(--ink);color:#fff}.banner{display:none;margin:0 0 8px;padding:9px;text-align:center;border-radius:10px;background:#171717;color:#fff;font-weight:750;font-size:13px}.banner.show{display:block}.banner.blocked{background:#93483d}.boardWrap{padding:7px}.board{position:relative;width:100%;aspect-ratio:1;background:rgba(255,255,255,.17);border-radius:10px;overflow:hidden}.piece,.ghost{position:absolute;display:flex;background:#fbf7ed;border:2px solid #202020;border-radius:8px;overflow:hidden;z-index:4}.piece.v,.ghost.v{flex-direction:column}.cube{position:relative;flex:1;min-width:0;min-height:0}.piece.h .cube+.cube,.ghost.h .cube+.cube{border-left:2px solid #202020}.piece.v .cube+.cube,.ghost.v .cube+.cube{border-top:2px solid #202020}.pips{position:absolute;inset:18%}.pip,.spip{position:absolute;background:#111;border-radius:50%;transform:translate(-50%,-50%)}.pip{width:18%;aspect-ratio:1}.ghost{background:rgba(105,105,105,.12);border-color:rgba(40,40,40,.22);z-index:3}.ghost .cube{opacity:.34}.ghost.selected{background:rgba(65,123,193,.16);border-color:var(--blue);box-shadow:0 0 0 2px rgba(65,123,193,.14)}.ghost.selected .cube{opacity:.7}.port,.choice{position:absolute;width:24px;height:24px;margin:-12px;border-radius:50%;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.18);z-index:11;display:grid;place-items:center;font-size:9px;font-weight:850}.port{border:3px solid var(--green);color:#255b40}.port.sel{background:var(--green);color:#fff;transform:scale(1.12)}.choice{border:3px solid var(--orange);color:#8a4c13}.choice.sel{background:var(--orange);color:#fff}.choice.route{font-size:13px}.choice.switch{border-color:#6f5aa8;color:#4d3b7b;background:#fff}.trace{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}.trace polyline.forward{fill:none;stroke:rgba(65,123,193,.62);stroke-width:.22;stroke-linecap:round;stroke-linejoin:round}.trace circle{fill:#fff;stroke:var(--blue);stroke-width:.20}.tag{position:absolute;z-index:10;transform:translate(-50%,-50%);background:#171717;color:white;border-radius:999px;padding:2px 5px;font-size:8px;font-weight:800;pointer-events:none}.tag.rebound{background:var(--orange)}.action{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.action button{padding:10px;font-size:12px}.action .accept{background:#171717;color:#fff}.action button:disabled{opacity:.3}.panel{padding:10px;margin-top:8px}.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}.tile{padding:4px!important;min-width:0}.tile.sel{outline:2px solid #111;background:#fff}.domino{display:flex;flex-direction:column;border:2px solid #222;border-radius:8px;overflow:hidden;background:#fbf7ed;margin:auto;width:38px}.half{width:34px;height:34px;position:relative}.half+.half{border-top:2px solid #222}.spips{position:absolute;inset:5px}.spip{width:5px;height:5px}.note{font-size:12px;line-height:1.35;color:#57524a;margin:7px 0}.teleHead{display:flex;justify-content:space-between;align-items:center;gap:5px}.copyBtn,.debugBtn{padding:7px 9px;font-size:11px}.debugBtn.on{background:#171717;color:#fff}.runlog,.debuglog{font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:170px;overflow:auto;color:#444;margin-top:7px;background:rgba(0,0,0,.025);padding:7px;border-radius:8px}.debuglog{display:none}.debuglog.show{display:block}.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#171717;color:#fff;padding:9px 12px;border-radius:999px;font-size:12px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1}@media(max-width:390px){.domino{width:34px}.half{width:30px;height:30px}.toolbar button{font-size:11px}.port,.choice{width:22px;height:22px;margin:-11px}}
</style></head><body><div class="app"><header><div><h1>ITERION</h1><div class="sub">PROTOTYPE v0.7.0 · PLAYER ROUTING</div></div><div class="sub">IPHONE BUILD</div></header>
<div class="stats"><div class="stat"><div class="k">Score</div><div id="score" class="v">0</div></div><div class="stat"><div class="k">Target</div><div class="v">120</div></div><div class="stat"><div class="k">Turn</div><div id="turn" class="v">0</div></div></div><div id="clear" class="banner">ROUND CLEARED</div><div id="blocked" class="banner blocked">NO LEGAL MOVES</div>
<div class="toolbar"><button id="l0" class="on">L0</button><button id="l1">L1</button><button id="l2">L2</button><button id="reset">New</button></div><div class="boardWrap"><div id="board" class="board"></div><div class="action"><button id="cancel" disabled>Cancelar</button><button id="accept" class="accept" disabled>Aceptar</button></div></div>
<div class="panel"><div class="k">Hand · 5 tiles</div><div id="hand" class="hand"></div></div><div class="panel"><div class="k">Circuito</div><p id="hint" class="note">Selecciona una ficha.</p></div>
<div class="panel"><div class="teleHead"><div class="k">Run telemetry</div><div><button id="debug" class="debugBtn">Debug signal</button> <button id="copy" class="copyBtn">Copiar run</button></div></div><div id="runlog" class="runlog">RUN START · target 120</div><div id="debuglog" class="debuglog"></div></div></div><div id="toast" class="toast"></div>
<script src="engine.js"></script><script>
const E=window.IterionEngine,{G,ARROW}=E,TARGET=120,P={0:[],1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,23],[72,23],[28,50],[72,50],[28,77],[72,77]]};
let z=0,sel=null,selectedPort=null,preview=null,res=[],hand=[],pieces=[],score=0,idc=0,turn=0,running=false,cleared=false,blocked=false,events=[],lastPath=[],lastSim=null,previewSim=null,startKey=null,routes={},debugOn=false;
function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makeSet(){let a=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)a.push({a:i,b:j});return sh(a)}function fill(){while(hand.length<5&&res.length)hand.push(res.shift())}function dots(n,s=false){return P[n].map(([x,y])=>`<i class="${s?'spip':'pip'}" style="left:${x}%;top:${y}%"></i>`).join('')}function pct(n){return(n/G*100)+'%'}function msg(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1200)}function ordered(p){return[...p.cubes].sort((a,b)=>p.axis==='H'?a.x-b.x:a.y-b.y)}function pc(id,arr=pieces){return arr.find(p=>p.id===id)}
function pieceEl(p,cls,onClick){let d=document.createElement('div');d.className=cls+' '+(p.axis==='H'?'h':'v');d.style.left=pct(p.rect.minx);d.style.top=pct(p.rect.miny);d.style.width=pct(p.rect.maxx-p.rect.minx);d.style.height=pct(p.rect.maxy-p.rect.miny);d.innerHTML=ordered(p).map(c=>`<div class="cube"><div class="pips">${dots(c.v)}</div></div>`).join('');if(onClick)d.onclick=onClick;return d}
function portPoint(port){let p=pc(port.pieceId);if(!p)return{x:-10,y:-10};if(port.centered){let x=(p.rect.minx+p.rect.maxx)/2,y=(p.rect.miny+p.rect.maxy)/2;if(port.side==='U')y=p.rect.miny;if(port.side==='D')y=p.rect.maxy;if(port.side==='L')x=p.rect.minx;if(port.side==='R')x=p.rect.maxx;return{x,y}}let c=p.cubes.find(x=>x.half===port.half),x=c.x+1,y=c.y+1;if(port.side==='U')y=c.y;if(port.side==='D')y=c.y+2;if(port.side==='L')x=c.x;if(port.side==='R')x=c.x+2;return{x,y}}
function connPoint(c,arr){let p=pc(c.toPieceId,arr),q=p?.cubes.find(x=>x.half===c.toHalf);return q?{x:q.x+1,y:q.y+1}:{x:-5,y:-5}}
function ports(){return sel===null||running||cleared||blocked||!pieces.length?[]:E.exposedPorts(hand[sel],z,pieces)}function rootCandidates(){return sel!==null&&!pieces.length?E.allPlacements(hand[sel],z,pieces):[]}function localCandidates(){if(!selectedPort)return[];let p=ports().find(x=>x.key===selectedPort);return p?p.placements:[]}function samePreview(c){return preview&&preview.x===c.x&&preview.y===c.y&&preview.z===c.z&&preview.rr===c.rr}
function tempState(){if(sel===null||!preview)return null;let id=idc+1,p=E.pieceFrom(hand[sel],preview.x,preview.y,preview.z,preview.rr,id),arr=[...pieces,p];return{id,p,arr}}
function recomputePreview(){previewSim=null;if(!preview||sel===null||!pieces.length)return;let t=tempState();previewSim=E.simulateSignal(t.id,t.arr,{startKey,routes})}
function renderTrace(b,sim=previewSim||lastSim){let path=preview?sim?.path:lastPath;if(!path?.length)return;let ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('class','trace');svg.setAttribute('viewBox',`0 0 ${G} ${G}`);let pl=document.createElementNS(ns,'polyline');pl.setAttribute('class','forward');pl.setAttribute('points',path.map(p=>`${p.x},${p.y}`).join(' '));svg.appendChild(pl);let ball=document.createElementNS(ns,'circle');ball.setAttribute('r','.32');let q=path[path.length-1];ball.setAttribute('cx',q.x);ball.setAttribute('cy',q.y);svg.appendChild(ball);b.appendChild(svg)}
function addTag(b,x,y,text,kind=''){let d=document.createElement('div');d.className='tag '+kind;d.style.left=pct(x);d.style.top=pct(y);d.textContent=text;b.appendChild(d)}
function renderSignalTags(b,sim){if(!sim)return;for(const e of sim.events||[]){if(e.type==='op'){let p=pc(e.piece,preview?tempState()?.arr:pieces),c=p?.cubes.find(x=>x.half===e.exitHalf);if(c)addTag(b,c.x+1,c.y+1,e.value===0?'0':`+${e.add}`)}if(e.type==='rebound'){let p=pc(e.piece,preview?tempState()?.arr:pieces);if(p)addTag(b,(p.rect.minx+p.rect.maxx)/2,(p.rect.miny+p.rect.maxy)/2,'REBOUND','rebound')}}}
function renderChoices(b){if(!preview||!previewSim)return;let t=tempState(),n=previewSim.needs;if(!n)return;if(n.type==='start')for(const c of n.choices){let q=connPoint(c,t.arr),d=document.createElement('button');d.className='choice';d.style.left=pct(q.x);d.style.top=pct(q.y);d.textContent='IN';d.onclick=()=>{startKey=c.key;recomputePreview();render()};b.appendChild(d)}else if(n.type==='route')for(const c of n.choices){let q=connPoint(c,t.arr),d=document.createElement('button');d.className='choice route';d.style.left=pct(q.x);d.style.top=pct(q.y);d.textContent='→';d.onclick=()=>{routes[n.routeKey]=c.key;recomputePreview();render()};b.appendChild(d)}}
function renderPersistentSwitches(b){let arr=preview?tempState()?.arr:pieces;for(const [rk,wanted] of Object.entries(routes)){let [pidS,entryS]=rk.split(':'),pid=+pidS,entry=+entryS,p=pc(pid,arr);if(!p||p.z!==z)continue;let outHalf=entry===0?1:0,opts=E.connectionsForPiece(p,arr).filter(c=>c.fromHalf===outHalf);if(opts.length<2)continue;let d=document.createElement('button');d.className='choice switch';d.style.left=pct((p.rect.minx+p.rect.maxx)/2);d.style.top=pct((p.rect.miny+p.rect.maxy)/2);d.textContent='S';d.onclick=()=>{let keys=opts.map(E.connectionKey),i=Math.max(0,keys.indexOf(wanted));routes[rk]=keys[(i+1)%keys.length];recomputePreview();render()};b.appendChild(d)}}
function ready(){return !!preview&&(!pieces.length||(previewSim&&previewSim.reason!=='needs-start'&&previewSim.reason!=='needs-route'))}
function render(){recomputePreview();let b=document.getElementById('board');b.innerHTML='';pieces.filter(p=>p.z===z).forEach(p=>b.appendChild(pieceEl(p,'piece')));let cs=pieces.length?localCandidates():rootCandidates();cs.forEach(c=>{let p=E.pieceFrom(hand[sel],c.x,c.y,c.z,c.rr,-1);b.appendChild(pieceEl(p,'ghost'+(samePreview(c)?' selected':''),()=>{preview={...c};startKey=null;recomputePreview();render()}))});if(pieces.length&&sel!==null&&!preview)ports().forEach(pt=>{let q=portPoint(pt),d=document.createElement('button');d.className='port'+(selectedPort===pt.key?' sel':'');d.style.left=pct(q.x);d.style.top=pct(q.y);d.textContent=pt.value;d.onclick=()=>{selectedPort=pt.key;preview=null;startKey=null;render()};b.appendChild(d)});if(preview){let t=tempState();b.appendChild(pieceEl(t.p,'ghost selected'));renderTrace(b);renderSignalTags(b,previewSim);renderChoices(b);renderPersistentSwitches(b)}else{renderTrace(b,lastSim);renderSignalTags(b,lastSim);renderPersistentSwitches(b)}document.getElementById('accept').disabled=!ready()||running||cleared||blocked;document.getElementById('cancel').disabled=!preview&&!selectedPort;document.getElementById('score').textContent=score;document.getElementById('turn').textContent=turn;document.getElementById('clear').classList.toggle('show',cleared);document.getElementById('blocked').classList.toggle('show',blocked&&!cleared);let h=document.getElementById('hand');h.innerHTML='';hand.forEach((t,i)=>{let bt=document.createElement('button');bt.className='tile'+(sel===i?' sel':'');bt.innerHTML=`<div class="domino"><div class="half"><div class="spips">${dots(t.a,true)}</div></div><div class="half"><div class="spips">${dots(t.b,true)}</div></div></div>`;bt.onclick=()=>{if(!running&&!cleared&&!blocked){sel=i;selectedPort=null;preview=null;startKey=null;render()}};h.appendChild(bt)});updateHint();renderLog();renderDebug()}
function updateHint(){let h=document.getElementById('hint');if(sel===null)h.textContent='Selecciona una ficha de la mano.';else if(!pieces.length)h.textContent='Elige una posición inicial gris.';else if(!preview)h.textContent=selectedPort?'Elige una posición gris conectada a ese puerto.':'Toca un puerto verde compatible.';else if(previewSim?.reason==='needs-start')h.textContent='Esta ficha crea varias entradas posibles. Toca IN para elegir por dónde entra la bola.';else if(previewSim?.reason==='needs-route')h.textContent='La ruta llega a una bifurcación. Toca una flecha naranja para configurar ese switch. Los botones S permiten cambiar switches ya guardados.';else h.textContent=`Ruta preparada · cascade prevista +${previewSim?.gain||0}. Pulsa Aceptar.`}
async function animate(sim){lastPath=[];lastSim=sim;render();for(let p of sim.path||[]){lastPath.push(p);render();await new Promise(r=>setTimeout(r,135))}}
async function accept(){if(!ready()||sel===null||running||cleared||blocked)return;let tile=hand[sel],v=E.validatePlacement(tile,preview.x,preview.y,preview.z,preview.rr,pieces);if(!v.ok)return msg('La posición ya no es válida');running=true;let p=E.pieceFrom(tile,preview.x,preview.y,preview.z,preview.rr,++idc);pieces.push(p);let sim=pieces.length===1?{gain:0,path:[],events:[],reason:'root'}:E.simulateSignal(p.id,pieces,{startKey,routes});hand.splice(sel,1);sel=null;selectedPort=null;preview=null;startKey=null;fill();turn++;let trigger=tile.a+tile.b;score+=trigger+sim.gain;await animate(sim);cleared=score>=TARGET;let rebounds=(sim.events||[]).filter(e=>e.type==='rebound').length;events.push({turn,tile:`${tile.a}|${tile.b}`,dir:ARROW[p.rr],level:p.z,trigger,cascade:sim.gain,total:score,rebounds,start:(sim.events||[]).find(e=>e.type==='start')?.key||'-',reason:sim.reason,ops:(sim.events||[]).filter(e=>e.type==='op').map(e=>`${e.piece}:${e.value}:${e.add}${e.reverse?'R':''}`).join(','),routes:Object.entries(routes).map(([k,v])=>`${k}=${v}`).join(';'),path:(sim.path||[]).map(q=>`${q.x.toFixed(1)},${q.y.toFixed(1)}`).join('>'),clear:cleared});running=false;if(!cleared)blocked=!E.hasLegalMove(hand,pieces,[0,1,2]);render();if(cleared)msg(`Round clear en ${turn} turnos`);else if(blocked)msg('No quedan movimientos legales')}
function renderLog(){let e=document.getElementById('runlog'),lines=events.map(v=>`T${v.turn} [${v.tile}] ${v.dir} L${v.level} · +${v.trigger} · cascade +${v.cascade} · R${v.rebounds} · ${v.reason} · total ${v.total}${v.clear?' · CLEAR':''}`);if(blocked&&!cleared)lines.push('NO LEGAL MOVES');e.textContent=lines.length?lines.join('\n'):'RUN START · target '+TARGET;e.scrollTop=e.scrollHeight}
function renderDebug(){let d=document.getElementById('debuglog');d.classList.toggle('show',debugOn);document.getElementById('debug').classList.toggle('on',debugOn);if(!debugOn)return;let sim=preview?previewSim:lastSim;if(!sim){d.textContent='No signal to inspect.';return}d.textContent=(sim.events||[]).map((e,i)=>{if(e.type==='start')return`${i+1}. START → piece ${e.toPieceId} half ${e.toHalf}`;if(e.type==='op')return`${i+1}. piece ${e.piece} enter ${e.entryHalf} → exit ${e.exitHalf} | value ${e.value} | ${e.add>=0?'+':''}${e.add}${e.reverse?' | REVERSE':''}`;if(e.type==='rebound')return`${i+1}. REBOUND piece ${e.piece} charge ${e.charge}`;if(e.type==='needs-route')return`${i+1}. SWITCH NEEDED piece ${e.piece} entry ${e.entryHalf}`;if(e.type==='die')return`${i+1}. END: ${e.reason}`;return`${i+1}. ${e.type}`}).join('\n')+`\n\nGAIN +${sim.gain||0} · reason=${sim.reason}`}
function fresh(){z=0;sel=null;selectedPort=null;preview=null;res=makeSet();hand=[];fill();pieces=[];score=0;idc=0;turn=0;running=false;cleared=false;blocked=false;events=[];lastPath=[];lastSim=null;previewSim=null;startKey=null;routes={};[0,1,2].forEach(i=>document.getElementById('l'+i).classList.toggle('on',i===0));render()}
function exportRun(){let status=cleared?'CLEAR':blocked?'NO LEGAL MOVES':'IN PROGRESS',text=`ITERION RUN v0.7.0\nTarget: ${TARGET}\nResult: ${status}\nTurns: ${turn}\nFinal score: ${score}\nTiles remaining: ${res.length+hand.length}\n\n`+events.map(v=>`T${v.turn} [${v.tile}] ${v.dir} L${v.level} trigger=+${v.trigger} cascade=+${v.cascade} rebounds=${v.rebounds} total=${v.total} start=${v.start} reason=${v.reason} ops=${v.ops||'-'} routes=${v.routes||'-'} path=${v.path||'-'}${v.clear?' CLEAR':''}`).join('\n');navigator.clipboard?.writeText(text).then(()=>msg('Run copiada')).catch(()=>{let a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();msg('Run copiada')})}
document.getElementById('accept').onclick=accept;document.getElementById('cancel').onclick=()=>{preview=null;selectedPort=null;startKey=null;render()};[0,1,2].forEach(i=>document.getElementById('l'+i).onclick=()=>{if(running||cleared||blocked)return;z=i;selectedPort=null;preview=null;startKey=null;[0,1,2].forEach(j=>document.getElementById('l'+j).classList.toggle('on',j===i));render()});document.getElementById('reset').onclick=fresh;document.getElementById('copy').onclick=exportRun;document.getElementById('debug').onclick=()=>{debugOn=!debugOn;renderDebug()};fresh();
</script></body></html>
