<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e8e4dc">
<title>ITERION</title>
<style>
:root{--bg:#e8e4dc;--paper:#f8f5ed;--paper2:#f1ede4;--ink:#111;--muted:#767168;--line:rgba(17,17,17,.13);--shadow:0 18px 55px rgba(35,30,23,.13);--cell-x:5.555%;--cell-y:4.166%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
body{overflow-x:hidden}.app{width:min(100%,560px);margin:auto;padding:calc(8px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;padding:4px 2px 11px}.brand h1{font-size:22px;line-height:1;margin:0;letter-spacing:.21em;font-weight:800}.eyebrow,.label{font-size:9px;line-height:1.15;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.version{margin-top:6px}.wallet{text-align:right}.wallet strong{display:block;font-size:22px;line-height:1.05;margin-top:3px;font-variant-numeric:tabular-nums}
.scoreStrip{display:grid;grid-template-columns:1fr 1fr;gap:7px}.scoreCard{background:rgba(248,245,237,.72);border:1px solid var(--line);border-radius:15px;padding:11px 12px 10px;min-width:0}.scoreValue{font-size:clamp(20px,6vw,31px);font-weight:820;line-height:1.05;margin-top:4px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.targetCard{background:rgba(255,255,255,.3)}
.metaStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}.meta{padding:7px 8px;border-top:1px solid var(--line)}.meta strong{display:block;font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
.boardShell{margin-top:9px;background:rgba(248,245,237,.54);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 1px 0 rgba(255,255,255,.45) inset}.boardTop{display:flex;justify-content:space-between;align-items:center;padding:3px 5px 7px}.boardTop strong{font-size:10px;letter-spacing:.08em}.board{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:13px;background-color:#f3efe6;background-image:linear-gradient(to right,rgba(20,20,20,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(20,20,20,.035) 1px,transparent 1px);background-size:var(--cell-x) var(--cell-y);box-shadow:inset 0 0 0 1px rgba(0,0,0,.035)}.board.dragging{box-shadow:inset 0 0 0 2px rgba(17,17,17,.18)}
.handDock{margin-top:9px;padding:8px 7px 7px;background:rgba(248,245,237,.65);border:1px solid var(--line);border-radius:15px}.handHeader{display:flex;justify-content:space-between;align-items:center;padding:0 3px 5px}.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;min-height:70px}.handSlot{height:70px;display:flex;align-items:center;justify-content:center;border-radius:9px}.tile{padding:3px;border:0;background:transparent;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}.tile.unplayable{opacity:.3;filter:grayscale(.7)}
.domino{position:relative;display:flex;flex-direction:column;width:32px;margin:auto;background:#fbf8f0;border:1.5px solid #1d1d1d;border-radius:6px;overflow:hidden;transform-origin:center;box-shadow:0 2px 4px rgba(0,0,0,.05)}.domino.back{background:#161616;border-color:#161616}.domino.back .half{opacity:0}.domino.reveal{animation:dealIn .38s ease-out both}.domino.reveal .spips{animation:pipsIn .38s ease-out both}.half{width:29px;height:29px;position:relative}.half+.half{border-top:1.5px solid #222}.spips,.pips{position:absolute;inset:16%}.pip,.spip{position:absolute;background:#111;border-radius:50%;transform:translate(-50%,-50%)}.pip{width:18%;aspect-ratio:1}.spip{width:4px;height:4px}
.piece{position:absolute;display:flex;background:#fbf8f0;border:1px solid #202020;border-radius:5px;overflow:hidden;z-index:4;box-shadow:0 1px 1px rgba(0,0,0,.035)}.piece.v{flex-direction:column}.cube{position:relative;flex:1;min-width:0;min-height:0}.piece.h .cube+.cube{border-left:1px solid #202020}.piece.v .cube+.cube{border-top:1px solid #202020}.dragCandidate{z-index:20;box-shadow:0 7px 18px rgba(0,0,0,.2);transform:scale(1.035);opacity:.97;pointer-events:none}.dragFloat{position:fixed;z-index:300;pointer-events:none;transform:translate(-50%,-50%) rotate(calc(var(--rr,0) * 90deg)) scale(1.2);opacity:.96;filter:drop-shadow(0 9px 12px rgba(0,0,0,.22));transition:transform .12s ease}
.upgradeDot{position:absolute;right:3px;top:3px;border-radius:50%;z-index:8;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.78)}.piece>.upgradeDot{right:2px;top:2px}.upgradeDot.u1{width:5px;height:5px;background:#2f80ed}.upgradeDot.u2{width:6px;height:6px;background:#8b5cf6}.upgradeDot.u3{width:7px;height:7px;background:#e5a12a}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.btn,.tool,.modal button,.shopBuy,.exactTile{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:11px;font:inherit;font-weight:700}.btn{padding:10px 8px;font-size:11px}.btn.secondary{background:transparent}.btn:disabled,.modal button:disabled,.shopBuy:disabled,.exactTile:disabled{opacity:.28}.hint{font-size:11px;line-height:1.4;color:#5e5951;text-align:center;min-height:16px;margin:7px 6px 0}.debugTools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.tool{padding:8px;background:transparent;font-size:9px;color:#5f5a52}.runlog{display:none;font:9px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:220px;overflow:auto;color:#49453f;margin-top:6px;background:rgba(255,255,255,.32);border:1px solid var(--line);border-radius:11px;padding:8px}.runlog.show{display:block}
.toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:#151515;color:#fff;padding:9px 13px;border-radius:999px;font-size:11px;opacity:0;transition:.2s;z-index:500;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.opfx{position:absolute;z-index:30;transform:translate(-50%,-50%);font-weight:900;font-size:14px;pointer-events:none;animation:pop .72s forwards}.finalfx{position:absolute;left:50%;top:50%;z-index:50;transform:translate(-50%,-50%);font-size:clamp(30px,11vw,52px);font-weight:900;letter-spacing:-.04em;pointer-events:none;animation:final 1s forwards;text-shadow:0 2px 0 rgba(255,255,255,.6)}.boardMessage{position:absolute;left:50%;top:50%;z-index:90;transform:translate(-50%,-50%);width:92%;text-align:center;font-size:25px;font-weight:900;letter-spacing:.09em;pointer-events:none;animation:boardMsg .9s ease-out forwards}.reboundFx{display:flex;align-items:center;justify-content:center}.reboundGlyph{display:block;width:16px;height:12px;position:relative;box-sizing:border-box;border:2px solid currentColor;border-right-color:transparent;border-bottom-color:transparent;border-radius:12px 0 0 0;transform:rotate(-18deg)}.reboundGlyph:after{content:'';position:absolute;left:-5px;top:-4px;width:6px;height:6px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(15deg)}
.overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(20,18,15,.46);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.modal{width:min(440px,96vw);max-height:92vh;overflow:auto;background:var(--paper);border:1px solid rgba(0,0,0,.16);border-radius:22px;padding:22px;text-align:center;box-shadow:var(--shadow)}.modal h2{font-size:24px;letter-spacing:.09em;margin:0 0 8px}.modal p{font-size:12px;color:#5e5951;margin:0 0 16px;line-height:1.4}.modalActions{display:grid;gap:7px;margin-top:10px}.modal button{padding:12px 11px;font-size:12px}.modal button.primary{background:#151515;color:#fff;border-color:#151515}.modal button.secondary{background:transparent}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0 15px;text-align:left}.sumCard{border:1px solid var(--line);border-radius:11px;padding:9px;background:rgba(255,255,255,.34)}.sumCard.wide{grid-column:1/-1}.sumLabel{font-size:8px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.sumValue{font-size:15px;font-weight:780;margin-top:3px}.sumSmall{font-size:10px;color:#625d55;margin-top:3px;line-height:1.3}
.marketIntro{font-size:11px;color:#5e5951;margin:0 0 10px}.marketDescriptions{display:grid;gap:7px;margin:0 0 13px;text-align:left}.marketDesc{border:1px solid var(--line);border-radius:11px;padding:9px;background:rgba(255,255,255,.35)}.marketDesc strong{display:block;font-size:11px;letter-spacing:.04em}.marketDesc span{display:block;font-size:10px;color:#625d55;line-height:1.35;margin-top:3px}
.bigShop{text-align:left}.shopHero{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;padding-bottom:12px;border-bottom:1px solid var(--line)}.shopHero strong{font-size:27px}.shopSection{padding:13px 0;border-bottom:1px solid var(--line)}.shopSection:last-child{border-bottom:0}.shopSection h3{font-size:11px;letter-spacing:.09em;margin:0 0 5px}.shopSection p{margin:0 0 9px;text-align:left}.shopBuy{width:100%;padding:11px;font-size:11px}.purchased{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.purchaseChip{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:999px;padding:4px 7px;background:rgba(255,255,255,.36)}.exactGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.exactTile{min-width:0;padding:7px 1px;font:9px ui-monospace,SFMono-Regular,Menlo,monospace}.exactTile.blank{visibility:hidden}.shopFoot{font-size:9px;color:var(--muted);margin-top:8px;line-height:1.35}
@keyframes dealIn{0%{background:#111;border-color:#111;transform:scaleY(.12);opacity:.7}55%{background:#777;border-color:#555;transform:scaleY(1.05)}100%{background:#fbf8f0;border-color:#222;transform:scaleY(1);opacity:1}}@keyframes pipsIn{0%,45%{opacity:0}100%{opacity:1}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-100%) scale(1.5)}}@keyframes final{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}@keyframes boardMsg{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}20%,65%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1.06)}}
@media(min-width:600px){.app{padding-left:16px;padding-right:16px}.boardShell{padding:8px}.handSlot{height:74px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><h1>ITERION</h1><div id="version" class="eyebrow version">prototype</div></div>
    <div class="wallet"><div class="label">Coins</div><strong id="coins">0</strong></div>
  </header>
  <section class="scoreStrip">
    <div class="scoreCard"><div class="label">Output</div><div id="score" class="scoreValue">0</div></div>
    <div class="scoreCard targetCard"><div class="label">Target</div><div id="target" class="scoreValue">20</div></div>
  </section>
  <section class="metaStrip">
    <div class="meta"><div class="label">Stage</div><strong id="stagestat">1/3</strong></div>
    <div class="meta"><div class="label">Round</div><strong id="roundstat">1/15</strong></div>
    <div class="meta"><div class="label">Moves</div><strong id="moves">0/7</strong></div>
    <div class="meta"><div class="label">Tiles left</div><strong id="tilesleft">28</strong></div>
  </section>
  <section class="boardShell">
    <div class="boardTop"><strong id="stageRound">STAGE 1 · ROUND 1/5</strong><span id="boardsize" class="label">18 × 24</span></div>
    <div id="board" class="board"></div>
  </section>
  <section class="handDock">
    <div class="handHeader"><span class="label">Hand</span><span id="rerollState" class="label">1 reroll</span></div>
    <div id="hand" class="hand"></div>
  </section>
  <div class="actions"><button id="reroll" class="btn">Reroll · 1</button><button id="reset" class="btn secondary">New run</button></div>
  <p id="hint" class="hint"></p>
  <div class="debugTools"><button id="viewrun" class="tool">View run data</button><button id="copyrun" class="tool">Copy run data</button></div>
  <div id="runlog" class="runlog"></div>
</div>
<div id="overlay" class="overlay"><div class="modal"><h2 id="overlayTitle"></h2><div id="overlayBody"></div><div class="modalActions"><button id="overlayPrimary" class="primary"></button><button id="overlaySecondary" class="secondary"></button><button id="overlayTertiary" class="secondary"></button></div></div></div>
<div id="toast" class="toast"></div>
<script src="engine.js"></script><script src="data.js"></script><script src="mods.js"></script><script src="game.js"></script><script src="ui.js"></script>
</body>
</html>
