</style></head><body><div class="app"><header><div><h1>ITERION</h1><div class="sub">v0.10.5 · 7 ROUND TEST</div></div><div class="sub">IPHONE</div></header><div class="stats"><div class="stat"><div class="k">Output</div><div id="score" class="v">0</div></div><div class="stat"><div class="k">Target</div><div id="target" class="v">20</div></div><div class="stat"><div class="k">Best</div><div id="best" class="v">0</div></div></div><div id="clear" class="banner"><span id="cleartext"></span> <button id="nextRound">NEXT ROUND</button></div><div id="blocked" class="banner">NO LEGAL MOVES</div><div class="toolbar"><button id="l0" class="on">L0</button><button id="l1">L1</button><button id="l2">L2</button><button id="l3">L3</button><button id="l4">L4</button><button id="reset">New</button></div><div class="play"><div class="boardWrap"><div id="board" class="board"></div></div><aside class="handRail"><div class="k" style="text-align:center">HAND</div><div id="hand" class="hand"></div></aside></div><div class="panel"><div class="k">Circuito</div><p id="hint" class="note"></p></div><div class="tools"><button id="viewrun" class="tool">Ver run</button><button id="copyrun" class="tool">Copiar run</button></div><div id="runlog" class="runlog"></div></div><div id="toast" class="toast"></div><script src="engine.js"></script><script>
const E=window.IterionEngine,{G,H,ARROW}=E,RT=[20,100,500,2500,15000,100000,1000000],P={0:[],1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,23],[72,23],[28,50],[72,50],[28,77],[72,77]]};let z=0,res=[],hand=[],pieces=[],score=0,best=0,round=0,wins=[],idc=0,turn=0,running=false,cleared=false,blocked=false,events=[],viewRun=false,seed=0,rngState=0,initialOrder=[],runId='',startedAt='',drag={active:false,index:-1,candidates:[],candidate:null,float:null};const px=n=>n/G*100+'%',py=n=>n/H*100+'%',wait=ms=>new Promise(r=>setTimeout(r,ms)),target=()=>RT[round];

function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makeSet(){let a=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)a.push({a:i,b:j});return sh(a)}function fill(){while(hand.length<5&&res.length)hand.push(res.shift())}function dots(n,s=false){return P[n].map(([x,y])=>`<i class="${s?'spip':'pip'}" style="left:${x}%;top:${y}%"></i>`).join('')}function ordered(p){return[...p.cubes].sort((a,b)=>p.axis==='H'?a.x-b.x:a.y-b.y)}function pc(id){return pieces.find(p=>p.id===id)}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1100)}function pieceEl(p,cls='piece'){let d=document.createElement('div');d.className=cls+' '+(p.axis==='H'?'h':'v');d.style.left=px(p.rect.minx);d.style.top=py(p.rect.miny);d.style.width=px(p.rect.maxx-p.rect.minx);d.style.height=py(p.rect.maxy-p.rect.miny);if(pieces.length===1&&p.id===pieces[0].id){d.dataset.root='1';d.onclick=rotateRoot}d.innerHTML=ordered(p).map(c=>`<div class="cube"><div class="pips">${dots(c.v)}</div></div>`).join('');return d}function mini(t){return`<div class="domino"><div class="half"><div class="spips">${dots(t.a,true)}</div></div><div class="half"><div class="spips">${dots(t.b,true)}</div></div></div>`}
function rotateRoot(e){if(e)e.stopPropagation();if(running||drag.active||pieces.length!==1)return;const old=pieces[0],base=old.cubes[0],tile=old.tile;for(let k=1;k<=3;k++){const rr=(old.rr+k)%4,v=E.validatePlacement(tile,base.x,base.y,base.z,rr,[]);if(v.ok){pieces[0]=E.pieceFrom(tile,base.x,base.y,base.z,rr,old.id);const ev=events[0];if(ev){ev.placement={x:base.x,y:base.y,z:base.z,rr};ev.dir=ARROW[rr]}saveRun();render();toast(`Primera ficha ${ARROW[rr]}`);return}}toast('No puede girar aquí')}
function renderBoard(){let b=document.getElementById('board');b.innerHTML='';pieces.filter(p=>p.z===z).forEach(p=>b.appendChild(pieceEl(p)));if(drag.active&&drag.candidate){let c=drag.candidate,p=E.pieceFrom(hand[drag.index],c.x,c.y,c.z,c.rr,-1);b.appendChild(pieceEl(p,'piece dragCandidate'))}b.classList.toggle('dragging',drag.active)}function renderHand(){let h=document.getElementById('hand');h.innerHTML='';hand.forEach((t,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML=mini(t);b.onpointerdown=e=>startDrag(e,i);h.appendChild(b)})}function render(){renderBoard();renderHand();scoreEl.textContent=score;bestEl.textContent=best;targetEl.textContent=target();cleartext.textContent=round===RT.length-1?'RUN COMPLETE':`ROUND ${round+1} CLEARED · ${score}`;nextRound.style.display=round===RT.length-1?'none':'inline-block';clear.classList.toggle('show',cleared);blockedEl.classList.toggle('show',blocked&&!cleared);hint.textContent=cleared?(round===RT.length-1?'Run completada.':'Pulsa NEXT ROUND.'):blocked?'No quedan colocaciones legales.':(pieces.length===1?'Toca la primera ficha para girarla. Se bloquea al colocar la segunda.':'Arrastra una ficha al tablero. La ficha visible se ajusta a la posición y orientación legal más cercana.');renderLog()}
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),targetEl=document.getElementById('target'),clear=document.getElementById('clear'),cleartext=document.getElementById('cleartext'),nextRound=document.getElementById('nextRound'),blockedEl=document.getElementById('blocked'),hint=document.getElementById('hint');
function center(c,r){let p=E.pieceFrom(hand[drag.index],c.x,c.y,c.z,c.rr,-1);return{x:(p.rect.minx+p.rect.maxx)/2/G*r.width,y:(p.rect.miny+p.rect.maxy)/2/H*r.height}}function nearest(x,y){let b=document.getElementById('board'),r=b.getBoundingClientRect(),lx=x-r.left,ly=y-r.top;if(lx<0||ly<0||lx>r.width||ly>r.height)return null;let pick=null,d0=1e9;for(const c of drag.candidates){let q=center(c,r),d=Math.hypot(q.x-lx,q.y-ly);if(d<d0){d0=d;pick=c}}return d0<=74?pick:null}function startDrag(e,i){if(running||cleared||blocked)return;e.preventDefault();let cs=E.allPlacements(hand[i],z,pieces);if(!cs.length)return toast(`Sin posición legal en L${z}`);let f=document.createElement('div');f.className='dragFloat';f.innerHTML=mini(hand[i]);document.body.appendChild(f);drag={active:true,index:i,candidates:cs,candidate:null,float:f};moveDrag(e)}function moveDrag(e){if(!drag.active)return;if(drag.float){drag.float.style.left=e.clientX+'px';drag.float.style.top=e.clientY+'px'}let c=nearest(e.clientX,e.clientY),o=drag.candidate,changed=(!c)!==(!o)||c&&(!o||c.x!==o.x||c.y!==o.y||c.rr!==o.rr);drag.candidate=c;if(changed)renderBoard()}async function endDrag(e){if(!drag.active)return;moveDrag(e);let i=drag.index,c=drag.candidate;if(drag.float)drag.float.remove();drag={active:false,index:-1,candidates:[],candidate:null,float:null};renderBoard();if(c)await place(i,c)}window.addEventListener('pointermove',moveDrag,{passive:false});window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
function heat(v,b=0,rev=false){let r=Math.max(v/target(),b/Math.max(18,target()));if(rev)r=Math.max(r,.72);return r<.58?'#111':r<.82?'#5b342c':r<1.05?'#9b2f24':'#d02018'}function fx(x,y,t,c,k=''){let d=document.createElement('div');d.className='opfx '+k;d.style.left=px(x);d.style.top=py(y);d.style.setProperty('--op',c);d.textContent=t;board.appendChild(d);setTimeout(()=>d.remove(),820)}function finalFx(v){let d=document.createElement('div');d.className='finalfx';d.style.setProperty('--op',heat(v,v));d.textContent=v;board.appendChild(d);setTimeout(()=>d.remove(),1200)}const board=document.getElementById('board');
async function animate(p,trigger,sim){renderBoard();fx((p.rect.minx+p.rect.maxx)/2,(p.rect.miny+p.rect.maxy)/2,`+${trigger}`,heat(trigger,trigger));await wait(480);for(const e of sim.events||[]){if(e.type==='op'&&e.value!==0){let pp=pc(e.piece),c=pp?.cubes.find(x=>x.half===e.exitHalf);if(!c)continue;let col=heat(e.after||trigger,Math.abs(e.delta||0),e.reverse);if(e.op==='add'){fx(c.x+1,c.y+1,`+${e.add}`,col);await wait(430)}else if(e.op==='multiply'){if(pp.double){fx(c.x+1,c.y+1,`×${e.value}`,col);await wait(350);fx(c.x+1,c.y+1,`×${e.value}`,col);await wait(400)}else{fx(c.x+1,c.y+1,`×${e.factor}`,col);await wait(500)}fx(c.x+1,c.y+1,`${e.after}`,col,'result');await wait(320)}}else if(e.type==='rebound'){let pp=pc(e.piece),c=pp?.cubes.find(x=>x.v===0)||pp?.cubes[0];if(c){fx(c.x+1,c.y+1,(e.charge||1)>1?'↩²':'↩',heat(sim.output,0,true),'retro');await wait(460)}}}await wait(120);finalFx(sim.output??trigger);await wait(1040)}
async function place(i,c){if(running||i<0||i>=hand.length)return;let tile=hand[i],v=E.validatePlacement(tile,c.x,c.y,c.z,c.rr,pieces);if(!v.ok)return toast('Posición no válida');running=true;let p=E.pieceFrom(tile,c.x,c.y,c.z,c.rr,++idc);pieces.push(p);let trigger=tile.a+tile.b,sim=pieces.length===1?{output:trigger,events:[],reason:'root',rebounds:0,search:{starts:0,leaves:1,expanded:0}}:E.bestSignal(p.id,pieces,{initialOutput:trigger});hand.splice(i,1);fill();turn++;await animate(p,trigger,sim);score=sim.output??trigger;best=Math.max(best,score);cleared=score>=target();if(cleared&&!wins.some(x=>x.round===round+1))wins.push({round:round+1,target:target(),output:score,turn});let st=(sim.events||[]).find(e=>e.type==='start'),rs=(sim.events||[]).filter(e=>e.type==='route');events.push({turn,tile:{a:tile.a,b:tile.b},placement:{x:c.x,y:c.y,z:c.z,rr:c.rr},dir:ARROW[p.rr],level:p.z,round:round+1,target:target(),trigger,output:score,rebounds:sim.rebounds||0,start:st?.key||'-',flipped:!!st?.flipped,reason:sim.reason,ops:(sim.events||[]).filter(e=>e.type==='op').map(e=>e.op==='multiply'?`${e.piece}:×${e.factor} ${e.before}>${e.after}${e.reverse?'R':''}`:`${e.piece}:+${e.add} ${e.before}>${e.after}${e.reverse?'R':''}`).join(','),routes:rs.map(e=>`${e.piece}:${e.entryHalf}>${e.toPieceId}:${e.toHalf}`).join(';'),search:sim.search?`${sim.search.starts}/${sim.search.leaves}/${sim.search.expanded}${sim.search.truncated?'!':''}`:'-',clear:cleared});running=false;if(!cleared)blocked=!E.hasLegalMove(hand,pieces,[0,1,2,3,4]);saveRun();render();if(cleared)toast(`Target alcanzado · ${score}`)}
function renderLog(){let e=document.getElementById('runlog'),ls=events.map(v=>`T${v.turn} [${v.tile.a}|${v.tile.b}] ${v.dir} L${v.level} · OUTPUT ${v.output}${v.clear?' · CLEAR':''}`);if(blocked&&!cleared)ls.push('NO LEGAL MOVES');e.textContent=ls.length?ls.join('\n'):'RUN START · target '+target();e.classList.toggle('show',viewRun)}function advance(){if(!cleared||round===RT.length-1)return;round++;score=0;cleared=false;blocked=!E.hasLegalMove(hand,pieces,[0,1,2,3,4]);saveRun();render();toast(`Ronda ${round+1} · target ${target()}`)}function snapshot(statusOverride){const status=statusOverride||(cleared&&round===RT.length-1?'COMPLETE':blocked?'NO LEGAL MOVES':'IN PROGRESS');return{schema:'iterion.run.v1',gameVersion:'0.10.5',engineVersion:'0.10.3-accumulator',runId,seed,startedAt,savedAt:new Date().toISOString(),status,round:{index:round+1,total:RT.length,target:target(),clears:wins},score:{last:score,best},turnCount:turn,initialOrder,hand:hand.map(t=>({...t})),reserve:res.map(t=>({...t})),board:pieces.map(p=>({id:p.id,a:p.tile.a,b:p.tile.b,x:p.cubes[0].x,y:p.cubes[0].y,z:p.z,rr:p.rr})),turns:events.map(e=>({...e,tile:{...e.tile},placement:{...e.placement}}))}}
function saveRun(statusOverride){try{const snap=snapshot(statusOverride);localStorage.setItem('iterion.latestRun.v1',JSON.stringify(snap));let hist=JSON.parse(localStorage.getItem('iterion.runHistory.v1')||'[]');hist=hist.filter(x=>x.runId!==snap.runId);hist.unshift(snap);localStorage.setItem('iterion.runHistory.v1',JSON.stringify(hist.slice(0,20)));return snap}catch(_){return snapshot(statusOverride)}}
function debugText(snap=snapshot()){return`ITERION DEBUG v${snap.gameVersion}\nRun ID: ${snap.runId}\nSeed: ${snap.seed}\nTarget: ${snap.round.target}\nResult: ${snap.status}\nTurns: ${snap.turnCount}\nLast output: ${snap.score.last}\nBest output: ${snap.score.best}\nRound: ${snap.round.index}/${snap.round.total}\nRound clears: ${snap.round.clears.map(x=>`R${x.round} target=${x.target} output=${x.output} turn=${x.turn}`).join(' | ')||'-'}\nTiles remaining: ${snap.hand.length+snap.reserve.length}\n\n`+snap.turns.map(v=>`T${v.turn} [${v.tile.a}|${v.tile.b}] ${v.dir} L${v.level} @${v.placement.x},${v.placement.y},${v.placement.z},r${v.placement.rr} trigger=${v.trigger} output=${v.output} rebounds=${v.rebounds} start=${v.start}${v.flipped?' FLIPPED':''} reason=${v.reason} ops=${v.ops||'-'} routes=${v.routes||'-'} search=${v.search}${v.clear?' CLEAR':''}`).join('\n')}
async function copyRun(){const snap=saveRun(),text=debugText(snap);try{await navigator.clipboard.writeText(text);toast('Run copiada · pega en ChatGPT')}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Run copiada · pega en ChatGPT')}
}
function fresh(){z=0;seed=(crypto.getRandomValues(new Uint32Array(1))[0]>>>0);rngState=seed|0;runId=`${Date.now().toString(36)}-${seed.toString(36)}`;startedAt=new Date().toISOString();res=makeSet();initialOrder=res.map(t=>({...t}));hand=[];fill();pieces=[];score=best=round=idc=turn=0;wins=[];running=cleared=blocked=false;events=[];viewRun=false;[0,1,2,3,4].forEach(i=>document.getElementById('l'+i).classList.toggle('on',i===0));render();saveRun()}
nextRound.onclick=advance;[0,1,2,3,4].forEach(i=>document.getElementById('l'+i).onclick=()=>{if(running||drag.active)return;z=i;[0,1,2,3,4].forEach(j=>document.getElementById('l'+j).classList.toggle('on',j===i));render()});document.getElementById('reset').onclick=fresh;document.getElementById('copyrun').onclick=copyRun;document.getElementById('viewrun').onclick=()=>{viewRun=!viewRun;renderLog()};fresh();
</script></body></html>
