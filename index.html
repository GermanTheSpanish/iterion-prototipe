<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ITERION v0.10.0</title><style>
:root{--bg:#eee9df;--paper:#faf7ef;--ink:#171717;--muted:#77736b;--green:#4d8062}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;overflow-x:hidden}.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 9px calc(16px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:end;padding:10px 2px 6px}h1{font-size:22px;letter-spacing:.16em;margin:0}.sub,.k{font-size:8px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stat,.panel,.boardWrap{background:rgba(255,255,255,.42);border:1px solid rgba(0,0,0,.1);border-radius:12px}.stat{padding:7px 8px}.v{font-size:19px;font-weight:750}.toolbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 0}button{font:inherit}.toolbar button,.action button,.tile,.copyBtn,.debugBtn{border:1px solid rgba(0,0,0,.16);background:var(--paper);border-radius:9px;color:var(--ink);font-weight:650}.toolbar button{padding:7px 2px;font-size:11px}.toolbar button.on{background:#171717;color:#fff}.play{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:6px;align-items:start}.boardWrap{padding:4px}.board{position:relative;width:100%;aspect-ratio:3/4;background:rgba(255,255,255,.09);border-radius:9px;overflow:hidden}.handRail{position:sticky;top:7px;border-left:1px solid rgba(0,0,0,.12);padding:3px}.hand{display:flex;flex-direction:column;gap:6px;margin-top:5px}.tile{padding:3px;background:transparent;border-color:transparent}.tile.sel{outline:1.5px solid #111;background:rgba(255,255,255,.65)}.domino{display:flex;flex-direction:column;width:30px;margin:auto;background:#fbf7ed;border:1.5px solid #222;border-radius:6px;overflow:hidden}.half{width:27px;height:27px;position:relative}.half+.half{border-top:1.5px solid #222}.spips,.pips{position:absolute;inset:16%}.pip,.spip{position:absolute;background:#111;border-radius:50%;transform:translate(-50%,-50%)}.pip{width:18%;aspect-ratio:1}.spip{width:4px;height:4px}.piece,.ghost{position:absolute;display:flex;background:#fbf7ed;border:1.5px solid #202020;border-radius:6px;overflow:hidden;z-index:4}.piece.v,.ghost.v{flex-direction:column}.cube{position:relative;flex:1;min-width:0;min-height:0}.piece.h .cube+.cube,.ghost.h .cube+.cube{border-left:1.5px solid #202020}.piece.v .cube+.cube,.ghost.v .cube+.cube{border-top:1.5px solid #202020}.ghost{background:rgba(80,80,80,.08);border-color:rgba(0,0,0,.2);z-index:3}.ghost .cube{opacity:.3}.ghost.selected{background:rgba(0,0,0,.08);border-color:#111}.ghost.selected .cube{opacity:.65}.port{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;background:#fff;border:2px solid var(--green);color:#315c45;z-index:12;font-size:8px;font-weight:800}.port.sel{background:var(--green);color:#fff}.action{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}.action button{padding:9px;font-size:11px}.action .accept{background:#171717;color:#fff}.action button:disabled{opacity:.28}.panel{padding:8px;margin-top:6px}.note{font-size:11px;line-height:1.3;color:#57524a;margin:5px 0}.copyBtn,.debugBtn{padding:6px 7px;font-size:10px}.runlog,.debuglog{font:9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:130px;overflow:auto;color:#444;margin-top:5px}.debuglog{display:none}.banner{display:none;margin:5px 0;padding:8px;text-align:center;border-radius:9px;background:#171717;color:#fff;font-weight:750;font-size:12px}.banner.show{display:block}.toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#171717;color:#fff;padding:8px 11px;border-radius:999px;font-size:11px;opacity:0;transition:.2s;z-index:40}.toast.show{opacity:1}.opfx{position:absolute;z-index:30;transform:translate(-50%,-50%) scale(.28);font-weight:900;font-size:13px;line-height:1;color:var(--op,#111);pointer-events:none;white-space:nowrap;animation:burst .72s cubic-bezier(.18,.8,.25,1) forwards;text-shadow:0 1px rgba(255,255,255,.8)}.opfx.result{font-size:11px}.opfx.retro{font-size:20px;font-family:Georgia,"Times New Roman",serif;font-variant-emoji:text}.finalfx{position:absolute;left:50%;top:50%;z-index:50;transform:translate(-50%,-50%) scale(.45);font-size:54px;font-weight:900;line-height:1;color:var(--op,#111);pointer-events:none;animation:finalBurst 1.15s cubic-bezier(.18,.8,.25,1) forwards;text-shadow:0 2px rgba(255,255,255,.8)}@keyframes finalBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-54%) scale(1.05)}}.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.tools button{padding:8px}.runlog{display:none}.runlog.show{display:block;background:rgba(255,255,255,.35);border:1px solid rgba(0,0,0,.1);border-radius:9px;padding:7px}@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.28)}20%{opacity:1}68%{opacity:1;transform:translate(-50%,-58%) scale(1.35)}100%{opacity:0;transform:translate(-50%,-78%) scale(1.7)}}
</style></head><body><div class="app"><header><div><h1>ITERION</h1><div class="sub">v0.10.0 · MACHINE OUTPUT</div></div><div class="sub">IPHONE</div></header><div class="stats"><div class="stat"><div class="k">Output</div><div id="score" class="v">0</div></div><div class="stat"><div class="k">Target</div><div class="v">20</div></div><div class="stat"><div class="k">Best</div><div id="best" class="v">0</div></div></div><div id="clear" class="banner">ROUND CLEARED</div><div id="blocked" class="banner">NO LEGAL MOVES</div><div class="toolbar levels"><button id="l0" class="on">L0</button><button id="l1">L1</button><button id="l2">L2</button><button id="l3">L3</button><button id="l4">L4</button><button id="reset">New</button></div><div class="play"><div class="boardWrap"><div id="board" class="board"></div></div><aside class="handRail"><div class="k" style="text-align:center">HAND</div><div id="hand" class="hand"></div></aside></div><div class="action"><button id="cancel" disabled>Cancelar</button><button id="accept" class="accept" disabled>Aceptar</button></div><div class="panel"><div class="k">Circuito</div><p id="hint" class="note">Selecciona una ficha.</p></div><div class="tools"><button id="viewrun" class="debugBtn">Ver run</button><button id="copy" class="copyBtn">Copiar debug</button></div><div id="runlog" class="runlog"></div><div id="debuglog" class="debuglog"></div></div><div id="toast" class="toast"></div><script src="engine.js"></script><script>
const E=window.IterionEngine,{G,H,ARROW}=E,TARGET=20,P={0:[],1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,23],[72,23],[28,50],[72,50],[28,77],[72,77]]};let z=0,sel=null,selectedPort=null,preview=null,res=[],hand=[],pieces=[],score=0,best=0,idc=0,turn=0,running=false,cleared=false,blocked=false,events=[],lastPath=[],lastSim=null,previewSim=null,debugOn=false,viewRun=false;
const px=n=>n/G*100+'%',py=n=>n/H*100+'%',wait=ms=>new Promise(r=>setTimeout(r,ms));function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makeSet(){let a=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)a.push({a:i,b:j});return sh(a)}function fill(){while(hand.length<5&&res.length)hand.push(res.shift())}function dots(n,s=false){return P[n].map(([x,y])=>`<i class="${s?'spip':'pip'}" style="left:${x}%;top:${y}%"></i>`).join('')}function ordered(p){return[...p.cubes].sort((a,b)=>p.axis==='H'?a.x-b.x:a.y-b.y)}function pc(id,arr=pieces){return arr.find(p=>p.id===id)}function msg(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1100)}
function pieceEl(p,cls,click){let d=document.createElement('div');d.className=cls+' '+(p.axis==='H'?'h':'v');d.style.left=px(p.rect.minx);d.style.top=py(p.rect.miny);d.style.width=px(p.rect.maxx-p.rect.minx);d.style.height=py(p.rect.maxy-p.rect.miny);d.innerHTML=ordered(p).map(c=>`<div class="cube"><div class="pips">${dots(c.v)}</div></div>`).join('');if(click)d.onclick=click;return d}function portPoint(o){let p=pc(o.pieceId);if(o.centered){let x=(p.rect.minx+p.rect.maxx)/2,y=(p.rect.miny+p.rect.maxy)/2;if(o.side==='U')y=p.rect.miny;if(o.side==='D')y=p.rect.maxy;if(o.side==='L')x=p.rect.minx;if(o.side==='R')x=p.rect.maxx;return{x,y}}let c=p.cubes.find(x=>x.half===o.half),x=c.x+1,y=c.y+1;if(o.side==='U')y=c.y;if(o.side==='D')y=c.y+2;if(o.side==='L')x=c.x;if(o.side==='R')x=c.x+2;return{x,y}}
function ports(){return sel===null||running||cleared||blocked||!pieces.length?[]:E.exposedPorts(hand[sel],z,pieces)}function roots(){return sel!==null&&!pieces.length?E.allPlacements(hand[sel],z,pieces):[]}function locals(){if(!selectedPort)return[];let p=ports().find(x=>x.key===selectedPort);return p?p.placements:[]}function same(c){return preview&&preview.x===c.x&&preview.y===c.y&&preview.z===c.z&&preview.rr===c.rr}function temp(){if(sel===null||!preview)return null;let id=idc+1,p=E.pieceFrom(hand[sel],preview.x,preview.y,preview.z,preview.rr,id);return{id,p,arr:[...pieces,p]}}function recalc(){previewSim=null;if(preview&&sel!==null&&pieces.length){let t=temp();previewSim=E.bestSignal(t.id,t.arr)}}
function render(){recalc();let b=document.getElementById('board');b.innerHTML='';pieces.filter(p=>p.z===z).forEach(p=>b.appendChild(pieceEl(p,'piece')));let cs=pieces.length?locals():roots();cs.forEach(c=>{let p=E.pieceFrom(hand[sel],c.x,c.y,c.z,c.rr,-1);b.appendChild(pieceEl(p,'ghost'+(same(c)?' selected':''),()=>{preview={...c};render()}))});if(pieces.length&&sel!==null&&!preview)ports().forEach(o=>{let q=portPoint(o),d=document.createElement('button');d.className='port'+(selectedPort===o.key?' sel':'');d.style.left=px(q.x);d.style.top=py(q.y);d.textContent=o.value;d.onclick=()=>{selectedPort=o.key;preview=null;render()};b.appendChild(d)});if(preview){let t=temp();b.appendChild(pieceEl(t.p,'ghost selected'))}document.getElementById('accept').disabled=!preview||running||cleared||blocked;document.getElementById('cancel').disabled=!preview&&!selectedPort;document.getElementById('score').textContent=score;document.getElementById('best').textContent=best;document.getElementById('clear').classList.toggle('show',cleared);document.getElementById('blocked').classList.toggle('show',blocked&&!cleared);let h=document.getElementById('hand');h.innerHTML='';hand.forEach((t,i)=>{let b=document.createElement('button');b.className='tile'+(sel===i?' sel':'');b.innerHTML=`<div class="domino"><div class="half"><div class="spips">${dots(t.a,true)}</div></div><div class="half"><div class="spips">${dots(t.b,true)}</div></div></div>`;b.onclick=()=>{if(!running&&!cleared&&!blocked){sel=i;selectedPort=null;preview=null;render()}};h.appendChild(b)});hint();renderLog()}
function hint(){let h=document.getElementById('hint');if(sel===null)h.textContent='Selecciona una ficha de la columna.';else if(!pieces.length)h.textContent='Elige una posición inicial.';else if(!preview)h.textContent=selectedPort?'Elige una posición conectada.':'Toca un puerto compatible.';else h.textContent=`Ruta óptima · output previsto ${hand[sel].a+hand[sel].b+(previewSim?.gain||0)}. Pulsa Aceptar.`}function heat(projected,burst=0,rev=false){let r=Math.max(projected/TARGET,burst/18);if(rev)r=Math.max(r,.72);if(r<.58)return'#111';if(r<.82)return'#5b342c';if(r<1.05)return'#9b2f24';return'#d02018'}function fx(x,y,text,color,kind=''){let d=document.createElement('div');d.className='opfx '+kind;d.style.left=px(x);d.style.top=py(y);d.style.setProperty('--op',color);d.textContent=text;document.getElementById('board').appendChild(d);setTimeout(()=>d.remove(),780)}function finalFx(value,color){let b=document.getElementById('board'),d=document.createElement('div');d.className='finalfx';d.style.setProperty('--op',color);d.textContent=value;b.appendChild(d);setTimeout(()=>d.remove(),1200)}
async function animate(p,trigger,sim){render();fx((p.rect.minx+p.rect.maxx)/2,(p.rect.miny+p.rect.maxy)/2,`+${trigger}`,heat(trigger,trigger));await wait(500);let gain=0;for(const e of sim.events||[]){if(e.type==='op'){if(e.value===0)continue;let pp=pc(e.piece),c=pp?.cubes.find(x=>x.half===e.exitHalf);if(!c)continue;let col=heat(trigger+gain+e.add,e.add,e.reverse);if(e.value%2===0){fx(c.x+1,c.y+1,`+${e.add}`,col);gain+=e.add;await wait(450)}else{fx(c.x+1,c.y+1,`×${e.value}`,col);await wait(520);if(e.add>0){fx(c.x+1,c.y+1,`+${e.add}`,col,'result');gain+=e.add;await wait(360)}}}else if(e.type==='rebound'){let pp=pc(e.piece),c=pp?.cubes.find(x=>x.v===0)||pp?.cubes[0];if(c){fx(c.x+1,c.y+1,(e.charge||1)>1?'↩²':'↩',heat(trigger+gain,0,true),'retro');await wait(500)}}}let output=trigger+(sim.gain||0);await wait(160);finalFx(output,heat(output,output));await wait(1080)}
async function accept(){if(!preview||sel===null||running)return;let tile=hand[sel],v=E.validatePlacement(tile,preview.x,preview.y,preview.z,preview.rr,pieces);if(!v.ok)return msg('Posición no válida');running=true;let p=E.pieceFrom(tile,preview.x,preview.y,preview.z,preview.rr,++idc);pieces.push(p);let sim=pieces.length===1?{gain:0,events:[],reason:'root',rebounds:0,search:{starts:0,leaves:1,expanded:0}}:E.bestSignal(p.id,pieces);hand.splice(sel,1);sel=null;selectedPort=null;preview=null;fill();turn++;let trigger=tile.a+tile.b;await animate(p,trigger,sim);score=trigger+sim.gain;best=Math.max(best,score);cleared=score>=TARGET;let start=(sim.events||[]).find(e=>e.type==='start'),rs=(sim.events||[]).filter(e=>e.type==='route');events.push({turn,tile:`${tile.a}|${tile.b}`,dir:ARROW[p.rr],level:p.z,trigger,cascade:sim.gain,total:score,rebounds:sim.rebounds||0,start:start?.key||'-',reason:sim.reason,ops:(sim.events||[]).filter(e=>e.type==='op').map(e=>`${e.piece}:${e.value}:${e.add}${e.reverse?'R':''}`).join(','),routes:rs.map(e=>`${e.piece}:${e.entryHalf}>${e.toPieceId}:${e.toHalf}`).join(';'),search:sim.search?`${sim.search.starts}/${sim.search.leaves}/${sim.search.expanded}${sim.search.truncated?'!':''}`:'-',clear:cleared});lastSim=sim;running=false;if(!cleared)blocked=!E.hasLegalMove(hand,pieces,[0,1,2,3,4]);render();if(cleared)msg(`Target alcanzado · ${score}`)}
function renderLog(){let e=document.getElementById('runlog'),lines=events.map(v=>`T${v.turn} [${v.tile}] ${v.dir} L${v.level} · trigger ${v.trigger} · cascade ${v.cascade} · OUTPUT ${v.total}${v.clear?' · CLEAR':''}`);if(blocked&&!cleared)lines.push('NO LEGAL MOVES');e.textContent=lines.length?lines.join('\n'):'RUN START · target '+TARGET;e.classList.toggle('show',viewRun);e.scrollTop=e.scrollHeight}function fresh(){z=0;sel=null;selectedPort=null;preview=null;res=makeSet();hand=[];fill();pieces=[];score=0;best=0;idc=0;turn=0;running=false;cleared=false;blocked=false;events=[];lastSim=null;previewSim=null;viewRun=false;[0,1,2,3,4].forEach(i=>document.getElementById('l'+i).classList.toggle('on',i===0));render()}function exportRun(){let status=cleared?'CLEAR':blocked?'NO LEGAL MOVES':'IN PROGRESS',text=`ITERION DEBUG v0.10.0\nTarget: ${TARGET}\nResult: ${status}\nTurns: ${turn}\nLast output: ${score}\nBest output: ${best}\nTiles remaining: ${res.length+hand.length}\n\n`+events.map(v=>`T${v.turn} [${v.tile}] ${v.dir} L${v.level} trigger=+${v.trigger} cascade=+${v.cascade} output=${v.total} rebounds=${v.rebounds} start=${v.start} reason=${v.reason} ops=${v.ops||'-'} routes=${v.routes||'-'} search=${v.search}${v.clear?' CLEAR':''}`).join('\n');navigator.clipboard?.writeText(text).then(()=>msg('Debug copiado')).catch(()=>msg('No se pudo copiar'))}
document.getElementById('accept').onclick=accept;document.getElementById('cancel').onclick=()=>{preview=null;selectedPort=null;render()};[0,1,2,3,4].forEach(i=>document.getElementById('l'+i).onclick=()=>{if(running)return;z=i;preview=null;selectedPort=null;[0,1,2,3,4].forEach(j=>document.getElementById('l'+j).classList.toggle('on',j===i));render()});document.getElementById('reset').onclick=fresh;document.getElementById('copy').onclick=exportRun;document.getElementById('viewrun').onclick=()=>{viewRun=!viewRun;renderLog()};fresh();
</script></body></html>
