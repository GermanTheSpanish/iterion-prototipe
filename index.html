:root{--bg:#eee9df;--paper:#faf7ef;--ink:#171717;--muted:#77736b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;overflow-x:hidden}.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 9px calc(18px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:end;padding:10px 2px 6px}h1{font-size:22px;letter-spacing:.16em;margin:0}.sub,.k{font-size:8px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stat,.panel,.boardWrap{background:rgba(255,255,255,.42);border:1px solid rgba(0,0,0,.1);border-radius:12px}.stat{padding:7px}.v{font-size:17px;font-weight:750}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:6px 0}button{font:inherit}.toolbar button,.tile,.tool{border:1px solid rgba(0,0,0,.16);background:var(--paper);border-radius:9px;color:var(--ink);font-weight:650}.toolbar button{padding:8px 3px;font-size:11px}.toolbar button:disabled{opacity:.35}.play{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:6px;align-items:start}.boardWrap{padding:4px}.board{position:relative;width:100%;aspect-ratio:3/4;background:rgba(255,255,255,.09);border-radius:9px;overflow:hidden}.board.dragging{outline:2px solid rgba(0,0,0,.12);outline-offset:-2px}.handRail{position:sticky;top:7px;border-left:1px solid rgba(0,0,0,.12);padding:3px}.hand{display:flex;flex-direction:column;gap:6px;margin-top:5px}.tile{padding:3px;background:transparent;border-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}.domino{display:flex;flex-direction:column;width:30px;margin:auto;background:#fbf7ed;border:1.5px solid #222;border-radius:6px;overflow:hidden}.half{width:27px;height:27px;position:relative}.half+.half{border-top:1.5px solid #222}.spips,.pips{position:absolute;inset:16 </style></head><body><div class="app"><header><div><h1>ITERION</h1><div class="sub">v0.11.1 · 7 PLACEMENTS</div></div><div class="sub">2D TEST</div></header><div class="stats"><div class="stat"><div class="k">Output</div><div id="score" class="v">0</div></div><div class="stat"><div class="k">Target</div><div id="target" class="v">20</div></div><div class="stat"><div class="k">Round</div><div id="roundstat" class="v">1/7</div></div><div class="stat"><div class="k">Moves</div><div id="moves" class="v">0/7</div></div></div><div id="clear" class="banner"><span id="cleartext"></span> <button id="nextRound">NEXT ROUND</button></div><div id="blocked" class="banner"></div><div class="toolbar"><button id="rotate">Girar T1 ↻</button><button id="reroll">Reroll mano · 1</button><button id="reset">New run</button></div><div class="play"><div class="boardWrap"><div id="board" class="board"></div></div><aside class="handRail"><div class="k" style="text-align:center">HAND</div><div id="hand" class="hand"></div></aside></div><div class="panel"><div class="k">Circuito</div><p id="hint" class="note"></p></div><div class="tools"><button id="viewrun" class="tool">Ver run</button><button id="copyrun" class="tool">Copiar run</button></div><div id="runlog" class="runlog"></div></div><div id="toast" class="toast"></div><script src="engine.js"></script><script>
const E=window.IterionEngine,{G,H,ARROW}=E,RT=[20,100,500,2500,15000,100000,1000000],MAX=7,P={0:[],1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,23],[72,23],[28,50],[72,50],[28,77],[72,77]]};let res=[],hand=[],pieces=[],score=0,best=0,round=0,roundTurn=0,turn=0,wins=[],events=[],idc=0,running=false,cleared=false,blocked=false,needsReroll=false,rerollUsed=false,rootRR=0,viewRun=false,seed=0,rngState=0,runId='',startedAt='',initialOrder=[],roundZero={drawn:0,placed:0,endHand:0},drag={active:false,index:-1,candidates:[],candidate:null,float:null};const px=n=>n/G*100+'%',py=n=>n/H*100+'%',wait=ms=>new Promise(r=>setTimeout(r,ms)),target=()=>RT[round],board=document.getElementById('board');
function rnd(){rngState=(rngState+0x6D2B79F5)|0;let t=rngState;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makeSet(){let a=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)a.push({a:i,b:j});return sh(a)}function countZero(a){return a.filter(t=>t.a===0||t.b===0).length}function fill(){while(hand.length<5&&res.length){let t=res.shift();hand.push(t);if(t.a===0||t.b===0)roundZero.drawn++}}function dots(n,s=false){return P[n].map(([x,y])=>`<i class="${s?'spip':'pip'}" style="left:${x}%;top:${y}%"></i>`).join('')}function ordered(p){return[...p.cubes].sort((a,b)=>p.axis==='H'?a.x-b.x:a.y-b.y)}function pc(id){return pieces.find(p=>p.id===id)}function mini(t){return`<div class="domino"><div class="half"><div class="spips">${dots(t.a,true)}</div></div><div class="half"><div class="spips">${dots(t.b,true)}</div></div></div>`}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1100)}function pieceEl(p,cls='piece'){let d=document.createElement('div');d.className=cls+' '+(p.axis==='H'?'h':'v');d.style.left=px(p.rect.minx);d.style.top=py(p.rect.miny);d.style.width=px(p.rect.maxx-p.rect.minx);d.style.height=py(p.rect.maxy-p.rect.miny);d.innerHTML=ordered(p).map(c=>`<div class="cube"><div class="pips">${dots(c.v)}</div></div>`).join('');return d}
function rootPlacements(tile){let out=[];for(let y=0;y<=H-2;y++)for(let x=0;x<=G-2;x++){let p=E.pieceFrom(tile,x,y,0,rootRR,-1);if(p.rect.minx>=0&&p.rect.miny>=0&&p.rect.maxx<=G&&p.rect.maxy<=H)out.push({x,y,z:0,rr:rootRR})}return out}function candidates(tile){return pieces.length?E.allPlacements(tile,0,pieces):rootPlacements(tile)}function renderBoard(){board.innerHTML='';pieces.forEach(p=>board.appendChild(pieceEl(p)));if(drag.active&&drag.candidate){let c=drag.candidate,p=E.pieceFrom(hand[drag.index],c.x,c.y,0,c.rr,-1);board.appendChild(pieceEl(p,'piece dragCandidate'))}board.classList.toggle('dragging',drag.active)}function renderHand(){let h=document.getElementById('hand');h.innerHTML='';hand.forEach((t,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML=mini(t);b.onpointerdown=e=>startDrag(e,i);h.appendChild(b)})}function render(){renderBoard();renderHand();scoreEl.textContent=score;targetEl.textContent=target();roundEl.textContent=`${round+1}/7`;movesEl.textContent=`${roundTurn}/${MAX}`;cleartext.textContent=round===6?'RUN COMPLETE':`ROUND ${round+1} CLEAR · ${score}`;nextRound.style.display=round===6?'none':'inline-block';clear.classList.toggle('show',cleared);blockedEl.classList.toggle('show',(blocked||needsReroll)&&!cleared);blockedEl.textContent=needsReroll?'NO LEGAL MOVE · REROLL AVAILABLE':roundTurn>=MAX?'ROUND FAILED · 7 PLACEMENTS':'NO LEGAL MOVES';rotateBtn.disabled=pieces.length>0||running;rerollBtn.disabled=rerollUsed||running||cleared||blocked;rerollBtn.textContent=rerollUsed?'Reroll usado':'Reroll mano · 1';hint.textContent=cleared?(round===6?'Run completada.':'Siguiente ronda: tablero y set se reinician.'):needsReroll?'No hay colocaciones legales. Usa el reroll para continuar.':blocked?'La ronda ha terminado.':pieces.length===0?`Coloca T1 donde quieras. Orientación ${ARROW[rootRR]}; usa Girar T1 para cambiarla.`:`Construye la máquina. ${MAX-roundTurn} colocaciones restantes.`;renderLog()}
const scoreEl=document.getElementById('score'),targetEl=document.getElementById('target'),roundEl=document.getElementById('roundstat'),movesEl=document.getElementById('moves'),clear=document.getElementById('clear'),cleartext=document.getElementById('cleartext'),nextRound=document.getElementById('nextRound'),blockedEl=document.getElementById('blocked'),hint=document.getElementById('hint'),rotateBtn=document.getElementById('rotate'),rerollBtn=document.getElementById('reroll');function center(c,r){let p=E.pieceFrom(hand[drag.index],c.x,c.y,0,c.rr,-1);return{x:(p.rect.minx+p.rect.maxx)/2/G*r.width,y:(p.rect.miny+p.rect.maxy)/2/H*r.height}}function nearest(x,y){let r=board.getBoundingClientRect(),lx=x-r.left,ly=y-r.top;if(lx<0||ly<0||lx>r.width||ly>r.height)return null;let pick=null,d0=1e9;for(const c of drag.candidates){let q=center(c,r),d=Math.hypot(q.x-lx,q.y-ly);if(d<d0){d0=d;pick=c}}return d0<=76?pick:null}function startDrag(e,i){if(running||cleared||blocked||needsReroll)return;e.preventDefault();let cs=candidates(hand[i]);if(!cs.length)return toast('Esta ficha no tiene posición legal');let f=document.createElement('div');f.className='dragFloat';f.innerHTML=mini(hand[i]);document.body.appendChild(f);drag={active:true,index:i,candidates:cs,candidate:null,float:f};moveDrag(e)}function moveDrag(e){if(!drag.active)return;if(drag.float){drag.float.style.left=e.clientX+'px';drag.float.style.top=e.clientY+'px'}let c=nearest(e.clientX,e.clientY),o=drag.candidate,changed=(!c)!==(!o)||c&&(!o||c.x!==o.x||c.y!==o.y||c.rr!==o.rr);drag.candidate=c;if(changed)renderBoard()}async function endDrag(e){if(!drag.active)return;moveDrag(e);let i=drag.index,c=drag.candidate;if(drag.float)drag.float.remove();drag={active:false,index:-1,candidates:[],candidate:null,float:null};renderBoard();if(c)await place(i,c)}window.addEventListener('pointermove',moveDrag,{passive:false});window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
function fx(x,y,t){let d=document.createElement('div');d.className='opfx';d.style.left=px(x);d.style.top=py(y);d.textContent=t;board.appendChild(d);setTimeout(()=>d.remove(),760)}function finalFx(v){let d=document.createElement('div');d.className='finalfx';d.textContent=v;board.appendChild(d);setTimeout(()=>d.remove(),1050)}async function animate(p,trigger,sim){renderBoard();fx((p.rect.minx+p.rect.maxx)/2,(p.rect.miny+p.rect.maxy)/2,`+${trigger}`);await wait(260);for(const e of sim.events||[]){if(e.type==='op'&&e.value!==0){let pp=pc(e.piece),c=pp?.cubes.find(x=>x.half===e.exitHalf);if(c){fx(c.x+1,c.y+1,e.op==='multiply'?`×${e.factor}`:`+${e.add}`);await wait(180)}}else if(e.type==='rebound'){let pp=pc(e.piece),c=pp?.cubes.find(x=>x.v===0)||pp?.cubes[0];if(c){fx(c.x+1,c.y+1,'↩');await wait(180)}}}finalFx(sim.output??trigger);await wait(600)}
async function place(i,c){if(running||needsReroll||i<0||i>=hand.length)return;let tile=hand[i];if(pieces.length){let v=E.validatePlacement(tile,c.x,c.y,0,c.rr,pieces);if(!v.ok)return toast('Posición no válida')}else{let p0=E.pieceFrom(tile,c.x,c.y,0,c.rr,-1);if(p0.rect.minx<0||p0.rect.miny<0||p0.rect.maxx>G||p0.rect.maxy>H)return toast('Fuera del tablero')}running=true;let p=E.pieceFrom(tile,c.x,c.y,0,c.rr,++idc);pieces.push(p);let trigger=tile.a+tile.b,sim=pieces.length===1?{output:trigger,events:[],reason:'root',rebounds:0,search:{starts:0,leaves:1,expanded:0}}:E.bestSignal(p.id,pieces,{initialOutput:trigger});hand.splice(i,1);if(tile.a===0||tile.b===0)roundZero.placed++;fill();turn++;roundTurn++;await animate(p,trigger,sim);score=sim.output??trigger;best=Math.max(best,score);cleared=score>=target();let st=(sim.events||[]).find(e=>e.type==='start'),rs=(sim.events||[]).filter(e=>e.type==='route');events.push({turn,round:round+1,roundTurn,tile:{a:tile.a,b:tile.b},placement:{x:c.x,y:c.y,z:0,rr:c.rr},dir:ARROW[c.rr],target:target(),trigger,output:score,rebounds:sim.rebounds||0,start:st?.key||'-',flipped:!!st?.flipped,reason:sim.reason,ops:(sim.events||[]).filter(e=>e.type==='op').map(e=>e.op==='multiply'?`${e.piece}:×${e.factor} ${e.before}>${e.after}${e.reverse?'R':''}`:`${e.piece}:+${e.add} ${e.before}>${e.after}${e.reverse?'R':''}`).join(','),routes:rs.map(e=>`${e.piece}:${e.entryHalf}>${e.toPieceId}:${e.toHalf}`).join(';'),search:sim.search?`${sim.search.starts}/${sim.search.leaves}/${sim.search.expanded}${sim.search.truncated?'!':''}`:'-',clear:cleared});needsReroll=false;if(cleared){roundZero.endHand=countZero(hand);wins.push({round:round+1,target:target(),output:score,turn,placements:roundTurn,zeros:{...roundZero}})}else if(roundTurn>=MAX){blocked=true;roundZero.endHand=countZero(hand)}else{let legal=E.hasLegalMove(hand,pieces,[0]);if(!legal){if(!rerollUsed)needsReroll=true;else{blocked=true;roundZero.endHand=countZero(hand)}}}running=false;saveRun();render();if(cleared)toast(`Round clear · ${score}`)}
function reroll(){if(rerollUsed||running||cleared||blocked)return;let n=hand.length;res.push(...hand);hand=[];sh(res);while(hand.length<n&&res.length){let t=res.shift();hand.push(t);if(t.a===0||t.b===0)roundZero.drawn++}rerollUsed=true;needsReroll=false;events.push({type:'reroll',round:round+1,roundTurn,hand:hand.map(t=>({...t}))});if(!E.hasLegalMove(hand,pieces,[0])){blocked=true;roundZero.endHand=countZero(hand)}saveRun();render();toast(blocked?'Sin movimientos después del reroll':'Mano renovada')}function startRound(){res=makeSet();if(round===0)initialOrder=res.map(t=>({...t}));hand=[];pieces=[];score=0;roundTurn=0;rerollUsed=false;needsReroll=false;rootRR=0;roundZero={drawn:0,placed:0,endHand:0};fill();cleared=blocked=false;render()}function advance(){if(!cleared||round===6)return;round++;startRound();saveRun();toast(`Ronda ${round+1} · target ${target()}`)}
function snapshot(statusOverride){const status=statusOverride||(cleared&&round===6?'COMPLETE':blocked?'ROUND FAILED':needsReroll?'REROLL REQUIRED':'IN PROGRESS');return{schema:'iterion.run.v2',gameVersion:'0.11.1',engineVersion:'0.10.3-accumulator',runId,seed,startedAt,savedAt:new Date().toISOString(),status,round:{index:round+1,total:7,target:target(),placements:roundTurn,maxPlacements:MAX,clears:wins},score:{last:score,best},turnCount:turn,rerollUsed,needsReroll,zeroStats:{...roundZero},initialOrder,hand:hand.map(t=>({...t})),reserve:res.map(t=>({...t})),board:pieces.map(p=>({id:p.id,a:p.tile.a,b:p.tile.b,x:p.cubes[0].x,y:p.cubes[0].y,z:0,rr:p.rr})),turns:events.map(e=>JSON.parse(JSON.stringify(e)))}}function saveRun(){try{let s=snapshot();localStorage.setItem('iterion.latestRun.v2',JSON.stringify(s));return s}catch(_){return snapshot()}}function debugText(s=snapshot()){let lines=[`ITERION DEBUG v${s.gameVersion}`,`Run ID: ${s.runId}`,`Seed: ${s.seed}`,`Result: ${s.status}`,`Round: ${s.round.index}/${s.round.total} · target=${s.round.target} · placements=${s.round.placements}/${s.round.maxPlacements}`,`Last output: ${s.score.last}`,`Best output: ${s.score.best}`,`Round clears: ${s.round.clears.map(x=>`R${x.round} target=${x.target} output=${x.output} placements=${x.placements} zeros=${x.zeros.drawn}/${x.zeros.placed}/${x.zeros.endHand}`).join(' | ')||'-'}`,`Current zeros drawn/placed/in-hand: ${s.zeroStats.drawn}/${s.zeroStats.placed}/${countZero(s.hand)}`,''];for(const v of s.turns){if(v.type==='reroll'){lines.push(`R${v.round} REROLL after placement ${v.roundTurn}`);continue}lines.push(`T${v.turn} R${v.round}.${v.roundTurn} [${v.tile.a}|${v.tile.b}] ${v.dir} @${v.placement.x},${v.placement.y},r${v.placement.rr} trigger=${v.trigger} output=${v.output} rebounds=${v.rebounds} start=${v.start}${v.flipped?' FLIPPED':''} reason=${v.reason} ops=${v.ops||'-'} routes=${v.routes||'-'} search=${v.search}${v.clear?' CLEAR':''}`)}return lines.join('\n')}function renderLog(){let e=document.getElementById('runlog');e.textContent=debugText();e.classList.toggle('show',viewRun)}async function copyRun(){let text=debugText(saveRun());try{await navigator.clipboard.writeText(text);toast('Run copiada · pega en ChatGPT')}catch(_){let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(__){}ta.remove();if(ok)toast('Run copiada · pega en ChatGPT');else{viewRun=true;renderLog();toast('Copia manualmente desde Ver run')}}}function fresh(){seed=crypto.getRandomValues(new Uint32Array(1))[0]>>>0;rngState=seed|0;runId=`${Date.now().toString(36)}-${seed.toString(36)}`;startedAt=new Date().toISOString();round=turn=idc=score=best=0;wins=[];events=[];running=cleared=blocked=needsReroll=false;viewRun=false;startRound();saveRun()}
rotateBtn.onclick=()=>{if(pieces.length||running)return;rootRR=(rootRR+1)%4;render();toast(`T1 ${ARROW[rootRR]}`)};rerollBtn.onclick=reroll;nextRound.onclick=advance;document.getElementById('reset').onclick=fresh;document.getElementById('copyrun').onclick=copyRun;document.getElementById('viewrun').onclick=()=>{viewRun=!viewRun;renderLog()};fresh();
</script></body></html>
